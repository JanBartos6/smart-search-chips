name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example 1.1.0'
        required: true
        type: string
      freemius_release_mode:
        description: 'Freemius release status'
        required: true
        default: pending
        type: choice
        options:
          - pending
          - beta
          - released
      wporg_dry_run:
        description: 'Run the WordPress.org SVN deploy without committing'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  verify-build:
    name: Verify and build release packages
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.release_version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release version
        id: release_version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          version="${version#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Release version must look like 1.1.0 or v1.1.0; got '$version'." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify version metadata
        shell: bash
        run: |
          version="${{ steps.release_version.outputs.version }}"
          grep -q "Version:     $version" smart-search-chips.php
          grep -q "define( 'SSCHP_VERSION', '$version' );" smart-search-chips.php
          grep -q "Stable tag: $version" readme.txt
          grep -q "Version:     $version" build-sources/wporg/smart-search-chips.php
          grep -q "define( 'SSCHP_VERSION', '$version' );" build-sources/wporg/smart-search-chips.php
          grep -q "Stable tag: $version" build-sources/wporg/readme.txt
          grep -q "'version'      => '$version'" blocks/search/editor.asset.php

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Make PowerShell available to npm scripts
        shell: bash
        run: |
          if ! command -v powershell >/dev/null 2>&1; then
            sudo ln -s "$(command -v pwsh)" /usr/local/bin/powershell
          fi
          powershell -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm run test:unit

      - name: Build release packages
        run: npm run build:release

      - name: Validate WordPress.org package
        run: npm run validate:wporg

      - name: Lint WordPress.org package
        run: npm run lint:wporg

      - name: Run browser compatibility tests
        run: npm run test:browser:compat

      - name: Prepare Freemius upload zip
        run: cp build/smart-search-chips-pro.zip smart-search-chips-pro.zip

      - name: Upload release package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ steps.release_version.outputs.version }}
          path: |
            build/smart-search-chips-pro.zip
            build/smart-search-chips-wporg.zip
            build/smart-search-chips-wporg/smart-search-chips/**
            smart-search-chips-pro.zip
          if-no-files-found: error

  deploy:
    name: Deploy release
    runs-on: ubuntu-latest
    needs: verify-build
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release package artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-packages-${{ needs.verify-build.outputs.version }}
          path: .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.verify-build.outputs.version }}
          name: Smart Search Chips ${{ needs.verify-build.outputs.version }}
          files: |
            build/smart-search-chips-wporg.zip
            build/smart-search-chips-pro.zip
          generate_release_notes: true

      - name: Deploy pending release to Freemius
        uses: buttonizer/freemius-deploy@v0.1.3
        with:
          file_name: smart-search-chips-pro.zip
          release_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.freemius_release_mode || 'pending' }}
          version: ${{ needs.verify-build.outputs.version }}
          sandbox: false
        env:
          PUBLIC_KEY: ${{ secrets.FREEMIUS_PUBLIC_KEY }}
          DEV_ID: ${{ secrets.FREEMIUS_DEV_ID }}
          SECRET_KEY: ${{ secrets.FREEMIUS_SECRET_KEY || secrets.FREEMIUS_PRIVATE_KEY }}
          PLUGIN_SLUG: ${{ secrets.FREEMIUS_PLUGIN_SLUG || 'smart-search-chips' }}
          PLUGIN_ID: ${{ secrets.FREEMIUS_PLUGIN_ID || '27046' }}

      - name: Deploy WordPress.org package
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.wporg_dry_run || false }}
        env:
          SVN_USERNAME: ${{ secrets.WPORG_USERNAME || secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_PASSWORD || secrets.SVN_PASSWORD }}
          SLUG: smart-search-chips
          VERSION: ${{ needs.verify-build.outputs.version }}
          BUILD_DIR: build/smart-search-chips-wporg/smart-search-chips
