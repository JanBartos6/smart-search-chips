name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build release zip
        run: |
          chmod +x build.sh
          bash build.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/smart-search-chips.zip
          generate_release_notes: true
