name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Make PowerShell available to npm scripts
        shell: bash
        run: |
          if ! command -v powershell >/dev/null 2>&1; then
            sudo ln -s "$(command -v pwsh)" /usr/local/bin/powershell
          fi
          powershell -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run PHP lint
        run: npm run lint:php

      - name: Run unit tests
        run: npm run test:unit

      - name: Build WordPress.org package
        run: npm run build:wporg

      - name: Validate WordPress.org package
        run: npm run validate:wporg

      - name: Lint WordPress.org package
        run: npm run lint:wporg

      - name: Build release packages
        run: npm run build:release

      - name: Upload release package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-package-candidates
          path: |
            build/smart-search-chips-pro.zip
            build/smart-search-chips-wporg.zip
          if-no-files-found: error

      - name: Run browser compatibility tests
        run: npm run test:browser:compat

      - name: Start local WordPress integration environment
        run: npm run local:wp:reset

      - name: Run full browser and WordPress integration tests
        env:
          SSCHP_TEST_BASE_URL: http://localhost:8899
        run: npm run test:browser

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: ignore

      - name: Stop local WordPress integration environment
        if: always()
        run: npm run local:wp:stop
